<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8a1c2b" />
    <meta name="color-scheme" content="only light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Godblooded</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* The dynamic viewport unit follows the browser bar; the percentage is the fallback. */
        height: 100dvh;
        overflow: hidden;
        background: #1a1410;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Keep the game out of the notch, the rounded corners and the gesture bar: the canvas is
         fitted inside the safe area, the rest is the page background. */
      body {
        box-sizing: border-box;
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
          env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      }
      #game {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
