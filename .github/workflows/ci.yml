name: CI

# Checks every pull request and every branch push the same way the deploy does. Wake-bell
# branches (doorbells, never merged) are skipped by branch name.
on:
  pull_request:
  push:
    branches-ignore: [main, art-inbox]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !endsWith(github.head_ref || github.ref_name, '-wake') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
