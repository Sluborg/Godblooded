name: CI

# Checks every pull request the same way the deploy does. Wake-bell PRs (draft PRs used as
# doorbells, never merged) are skipped by branch name.
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !endsWith(github.head_ref, '-wake') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
