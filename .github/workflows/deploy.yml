name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Inbox, session and art-queue commits go straight to main; they need no deploy.
    paths-ignore: ['docs/**', 'art-tasks/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build
        run: |
          # Base path from the real repo name, keeps its casing (e.g. /Godblooded/).
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
